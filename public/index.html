<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lunes.script - المصادقة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
        <!-- Brand Logo -->
        <div class="text-center mb-8">
            <div class="text-indigo-400 font-bold text-2xl tracking-wider mb-2">
                lunes<span class="text-white">.script</span>
            </div>
            <p class="text-slate-400 text-xs">نظام حماية وإدارة السكريبتات المتقدم</p>
        </div>

        <!-- Tabs Switcher -->
        <div class="flex bg-slate-950 p-1 rounded-xl mb-6 border border-slate-800">
            <button onclick="switchTab('login')" id="loginTabBtn" class="flex-1 py-2 rounded-lg text-xs font-bold transition bg-indigo-600 text-white">تسجيل الدخول</button>
            <button onclick="switchTab('register')" id="registerTabBtn" class="flex-1 py-2 rounded-lg text-xs font-bold transition text-slate-400 hover:text-white">حساب جديد</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">البريد الإلكتروني</label>
                <input type="email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500" placeholder="name@example.com">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">كلمة المرور</label>
                <input type="password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl text-xs font-bold transition shadow-lg shadow-indigo-600/20">تسجيل الدخول</button>
        </form>

        <!-- Register Form (Hidden by default) -->
        <form id="registerForm" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">اسم المستخدم</label>
                <input type="text" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500" placeholder="Username">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">البريد الإلكتروني</label>
                <input type="email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500" placeholder="name@example.com">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">كلمة المرور</label>
                <input type="password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500" placeholder="••••••••">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">تأكيد كلمة المرور</label>
                <input type="password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl text-xs font-bold transition shadow-lg shadow-indigo-600/20">إنشاء حساب وإرسال رمز التحقق</button>
        </form>
    </div>

    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const loginBtn = document.getElementById('loginTabBtn');
            const registerBtn = document.getElementById('registerTabBtn');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                loginBtn.className = 'flex-1 py-2 rounded-lg text-xs font-bold transition bg-indigo-600 text-white';
                registerBtn.className = 'flex-1 py-2 rounded-lg text-xs font-bold transition text-slate-400 hover:text-white';
            } else {
                registerForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                registerBtn.className = 'flex-1 py-2 rounded-lg text-xs font-bold transition bg-indigo-600 text-white';
                loginBtn.className = 'flex-1 py-2 rounded-lg text-xs font-bold transition text-slate-400 hover:text-white';
            }
        }
    </script>
    <script src="/auth.js"></script>
</body>
</html>
