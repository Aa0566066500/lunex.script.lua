<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - lunex.script</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col md:flex-row">

    <!-- Sidebar -->
    <aside class="w-full md:w-64 bg-slate-900 border-l border-slate-800 flex flex-col justify-between p-6 shrink-0">
        <div>
            <div class="text-indigo-400 font-bold text-2xl tracking-wider mb-8">
                lunex<span class="text-white">.script</span>
            </div>
            <nav class="space-y-2">
                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-indigo-600/10 text-indigo-400 font-medium text-xs">السكريبتات الخاصة</a>
            </nav>
        </div>
        <div class="mt-6 md:mt-0">
            <a href="/index.html" class="block text-right px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800 transition text-xs font-medium">الرئيسية</a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6 md:p-10 overflow-y-auto">
        <!-- Top Header -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 pb-4 border-b border-slate-800">
            <div>
                <h1 class="text-xl md:text-2xl font-bold">لوحة التحكم</h1>
                <p class="text-slate-400 text-xs">إدارة وحماية سكريبتاتك بكفاءة عالية على Cloudflare</p>
            </div>
            <button onclick="openAddModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl font-bold text-xs transition shadow-lg shadow-indigo-600/20 cursor-pointer">
                + إضافة سكريبت جديد
            </button>
        </header>

        <!-- Scripts Grid (Empty by default) -->
        <div id="scriptsGrid" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- سيتم إضافة السكريبتات هنا ديناميكياً -->
        </div>
    </main>

    <!-- Modal for Adding New Script -->
    <div id="scriptModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="max-w-lg w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
            <h3 class="text-lg font-bold text-white mb-4">إضافة سكريبت جديد</h3>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">اسم السكريبت</label>
                    <input type="text" id="scriptTitleInput" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500" placeholder="مثال: Game Hub V1">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">كود السكريبت (Source)</label>
                    <textarea id="scriptSourceInput" rows="6" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs font-mono text-white focus:outline-none focus:border-indigo-500" placeholder="print('Hello World!')"></textarea>
                </div>
            </div>

            <div class="flex gap-2 mt-6">
                <button onclick="saveScript()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl text-xs font-bold transition cursor-pointer">إنشاء الرابط</button>
                <button onclick="closeAddModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-5 py-2.5 rounded-xl text-xs font-medium transition cursor-pointer">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        function openAddModal() {
            document.getElementById('scriptModal').classList.remove('hidden');
            document.getElementById('scriptModal').classList.add('flex');
        }

        function closeAddModal() {
            document.getElementById('scriptModal').classList.remove('flex');
            document.getElementById('scriptModal').classList.add('hidden');
        }

        function copyText(text) {
            navigator.clipboard.writeText(text);
            alert('تم نسخ رابط السحب بنجاح!');
        }

        function saveScript() {
            const title = document.getElementById('scriptTitleInput').value.trim();
            const source = document.getElementById('scriptSourceInput').value.trim();

            if (!title || !source) {
                alert('الرجاء إدخال اسم السكريبت والكود الخاص به.');
                return;
            }

            // توليد رمز فريد ومختصر للرابط
            const token = Math.random().toString(36).substring(2, 10);
            const domain = window.location.origin;
            const loadstringCode = `loadstring(game:HttpGet("${domain}/exec?token=${token}"))()`;

            // إضافة كرت السكريبت جديد إلى القائمة
            const grid = document.getElementById('scriptsGrid');
            const cardHTML = `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col justify-between shadow-xl">
                    <div>
                        <div class="flex justify-between items-start mb-4">
                            <h3 class="font-bold text-base text-slate-100">${escapeHtml(title)}</h3>
                            <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] px-2.5 py-1 rounded-full">محمي بنجاح</span>
                        </div>
                        <p class="text-slate-400 text-[11px] font-mono mb-4 bg-slate-950 p-3 rounded-xl border border-slate-800 overflow-x-auto whitespace-nowrap">
                            ${escapeHtml(loadstringCode)}
                        </p>
                    </div>

                    <div>
                        <div class="flex items-center justify-between bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 mb-4">
                            <span class="text-xs text-slate-300 font-mono truncate ml-2">${loadstringCode}</span>
                            <button onclick="copyText('${escapeHtml(loadstringCode)}')" class="text-indigo-400 hover:text-indigo-300 text-xs font-medium transition shrink-0 cursor-pointer">نسخ الكود</button>
                        </div>

                        <div class="flex gap-2">
                            <button onclick="this.closest('.bg-slate-900').remove()" class="w-full bg-red-500/10 hover:bg-red-500/20 text-red-400 py-2 rounded-xl text-xs font-medium transition cursor-pointer">حذف السكريبت</button>
                        </div>
                    </div>
                </div>
            `;

            grid.insertAdjacentHTML('afterbegin', cardHTML);

            // تفريغ الحقول وإغلاق النافذة
            document.getElementById('scriptTitleInput').value = '';
            document.getElementById('scriptSourceInput').value = '';
            closeAddModal();
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
